version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messmate_web
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass@db:5432/messmate?schema=public
      - NEXT_PUBLIC_APP_URL=https://messmate.com
      - NEXT_PUBLIC_ROOT_DOMAIN=messmate.com
      - AUTH_SECRET=${AUTH_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - messmate_net

  db:
    image: postgres:16-alpine
    container_name: messmate_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass
      POSTGRES_DB: messmate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - messmate_net

  caddy:
    image: caddy:2-alpine
    container_name: messmate_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - messmate_net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  messmate_net:
    driver: bridge
